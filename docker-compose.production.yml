version: '3.8'

# =============================================================================
# FileShare — Production Deployment from Docker Hub
# =============================================================================
# Использование:
# 1. Замените YOUR_DOCKERHUB_USERNAME на ваш username
# 2. Замените 1.0.0 на нужную версию
# 3. Создайте .env файл с настройками
# 4. docker compose -f docker-compose.production.yml up -d
# =============================================================================

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: fileshare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fileshare}
      POSTGRES_USER: ${DB_USER:-fileshare}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_/var/lib/postgresql/data
    networks:
      - fileshare-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fileshare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (from Docker Hub)
  backend:
    image: YOUR_DOCKERHUB_USERNAME/fileshare-backend:1.0.0
    container_name: fileshare-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fileshare}
      DB_USER: ${DB_USER:-fileshare}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      UPLOAD_PATH: /app/uploads
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-7}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-fs_sid}
      COOKIE_SECRET: ${COOKIE_SECRET}
      ADMIN_SECRET_PATH: ${ADMIN_SECRET_PATH}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - uploads_/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fileshare-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (from Docker Hub)
  frontend:
    image: YOUR_DOCKERHUB_USERNAME/fileshare-frontend:1.0.0
    container_name: fileshare-frontend
    restart: unless-stopped
    networks:
      - fileshare-network

  # Nginx (reverse proxy + SSL)
  nginx:
    image: nginx:alpine
    container_name: fileshare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - fileshare-network

volumes:
  postgres_
    driver: local
  uploads_
    driver: local

networks:
  fileshare-network:
    driver: bridge
